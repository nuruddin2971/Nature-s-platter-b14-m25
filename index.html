<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature's Platter</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="bg-[#EFEBE3]">
      <nav class="grid grid-cols-3 items-center gap-4 w-11/12 mx-auto pt-4">
        <img src="./assets/nav-logo.png" alt="" class="w-30 h-auto" />
        <ul class="flex gap-4">
          <li><a href="">Product</a></li>
          <li><a href="">Services</a></li>
          <li><a href="">Contact us</a></li>
        </ul>
        <div class="flex gap-4">
          <span><i class="fa-solid fa-magnifying-glass"></i></span>
          <span><i class="fa-solid fa-cart-shopping"></i></span>
          <button
            class="rounded border border-green-500 font-semibold cursor-pointer px-3 py-1"
          >
            Login
          </button>
          <button
            class="rounded bg-green-500 font-semibold text-white cursor-pointer px-3 py-1"
          >
            Register
          </button>
        </div>
      </nav>

      <section class="text-center py-15">
        <div class="max-w-[40%] mx-auto">
          <h2 class="font-bold text-4xl mb-8">
            Freshness
            <span class="text-green-500"
              >You Can <br />
              Count</span
            >
            On, Prices You’ll Love!
          </h2>
          <p>
            Shop your daily essentials at unbeatable prices. From fresh produce
            to pantry staples, we’ve got you covered every day!
          </p>
        </div>
        <img
          src="./assets/Hero Section 1.png"
          alt=""
          class="max-w-200 mx-auto pt-8"
        />
      </section>
    </header>
  </body>
</html>
